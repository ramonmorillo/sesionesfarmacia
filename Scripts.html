<script>
  let state = { sesiones: [], profesionales: [], tiposSesion: [], estados: [], incidenciasSesiones: [] };

  document.addEventListener('DOMContentLoaded', () => {
    bindEvents();
    const fMes = document.getElementById('fMes');
    if (fMes) fMes.value = new Date().toISOString().slice(0, 7);
    cargarDatos();
  });

  function bindEvents() {
    document.getElementById('btnNueva')?.addEventListener('click', () => abrirModal());
    document.getElementById('btnCerrar')?.addEventListener('click', cerrarModal);
    document.getElementById('formSesion')?.addEventListener('submit', guardarSesion);
    document.getElementById('btnImprimir')?.addEventListener('click', () => window.print());
    document.getElementById('btnResumen')?.addEventListener('click', copiarResumenMensual);
    ['fMes', 'fPonente', 'fTipo', 'fEstado'].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', renderListado);
      else console.warn(`[bindEvents] No existe el selector ${id}`);
    });
    document.getElementById('ponente')?.addEventListener('change', autocompletarArea);
  }

  function cargarDatos() {
    google.script.run
      .withSuccessHandler(handleInitialData)
      .withFailureHandler(handleInitialDataError)
      .getInitialData();
  }

  function handleInitialData(data) {
    console.log('[getInitialData]', data);
    if (!data || typeof data !== 'object') {
      mostrarErrorMaestros('Respuesta inválida al cargar datos iniciales.');
      return;
    }
    if (data.ok === false) {
      mostrarErrorMaestros(data.message || 'No se pudieron cargar los datos maestros.');
      if (data.diagnostics) console.warn('[getInitialData diagnostics]', data.diagnostics);
    }

    if (!Array.isArray(data.profesionales)) console.warn('[getInitialData] profesionales no es array');
    if (!Array.isArray(data.tiposSesion)) console.warn('[getInitialData] tiposSesion no es array');
    if (!Array.isArray(data.estados)) console.warn('[getInitialData] estados no es array');
    if (!Array.isArray(data.sesiones)) console.warn('[getInitialData] sesiones no es array');

    state.profesionales = Array.isArray(data.profesionales) ? data.profesionales : [];
    state.tiposSesion = Array.isArray(data.tiposSesion) ? data.tiposSesion : [];
    state.estados = Array.isArray(data.estados) && data.estados.length ? data.estados : ['Programada', 'Realizada', 'Cancelada'];
    state.sesiones = Array.isArray(data.sesiones) ? data.sesiones : [];
    state.incidenciasSesiones = Array.isArray(data.incidenciasSesiones) ? data.incidenciasSesiones : [];

    poblarFiltros();
    renderListado();
    mostrarIncidenciasSesion();

    if (!state.profesionales.length || !state.tiposSesion.length) {
      mostrarErrorMaestros("No se pudieron cargar los datos maestros. Revise que existan las pestañas 'Profesionales' y 'TiposSesion', que sus encabezados sean correctos y que haya filas activas marcadas como 'Sí'.");
      return;
    }
    ocultarErrorMaestros();
  }

  function handleInitialDataError(err) {
    console.error('[getInitialDataError]', err);
    mostrarErrorMaestros("No se pudieron cargar los datos maestros. Revise que existan las pestañas 'Profesionales' y 'TiposSesion', que sus encabezados sean correctos y que haya filas activas marcadas como 'Sí'.");
  }

  function poblarFiltros() {
    fillSelect('fPonente', state.profesionales.map((p) => p.nombre), true);
    fillSelect('fTipo', state.tiposSesion, true);
    fillSelect('fEstado', state.estados, true);
    fillSelect('ponente', state.profesionales.map((p) => p.nombre), false);
    fillSelect('tipoSesion', state.tiposSesion, false);
    fillSelect('estado', state.estados, false);
  }

  function fillSelect(id, items, allowEmpty) {
    const el = document.getElementById(id);
    if (!el) {
      console.warn(`[fillSelect] No existe el selector ${id}`);
      return;
    }
    const defaultLabel = allowEmpty ? 'Todos' : 'Seleccione';
    el.innerHTML = '';
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = defaultLabel;
    el.appendChild(opt);
    (Array.isArray(items) ? items : []).forEach((item) => {
      const val = typeof item === 'string' ? item : (item && item.nombre) ? item.nombre : '';
      if (!val) return;
      const option = document.createElement('option');
      option.value = val;
      option.textContent = val;
      el.appendChild(option);
    });
  }

  function getSesionesFiltradas() {
    const mes = document.getElementById('fMes').value;
    const ponente = document.getElementById('fPonente').value;
    const tipo = document.getElementById('fTipo').value;
    const estado = document.getElementById('fEstado').value;

    return state.sesiones.filter(s => {
      if (!estado && s.estado === 'Cancelada') return false;
      if (mes && !s.fecha.startsWith(mes)) return false;
      if (ponente && s.ponente !== ponente) return false;
      if (tipo && s.tipoSesion !== tipo) return false;
      if (estado && s.estado !== estado) return false;
      return true;
    });
  }

  function renderListado() {
    const cont = document.getElementById('listado');
    const sesiones = getSesionesFiltradas();
    if (!sesiones.length) {
      cont.innerHTML = '<div class="card">No hay sesiones con los filtros seleccionados.</div>';
      return;
    }
    cont.innerHTML = sesiones.map(s => `
      <article class="sesion session-card estado-${escapeHtml(s.estado)}">
        <div class="session-card-header">
          <h4 class="session-title">${escapeHtml(s.tema)}</h4>
          <div class="session-badges">
            <span class="badge badge-type">${escapeHtml(s.tipoSesion)}</span>
            <span class="badge badge-status badge-${escapeHtml(normalizeBadgeClass(s.estado))}">${escapeHtml(s.estado)}</span>
          </div>
        </div>
        <div class="meta session-meta">
          <span class="session-datetime"><b>${escapeHtml(formatFechaLarga(s.fecha))}</b> · ${escapeHtml(s.hora)} · ${escapeHtml(String(s.duracionMin))} min</span>
          <span>Ponente: ${escapeHtml(s.ponente)}${s.area ? ' · Área: ' + escapeHtml(s.area) : ''}</span>
          ${s.sustituto ? `<span>Sustituto: ${escapeHtml(s.sustituto)}</span>` : ''}
        </div>
        <div class="row-actions session-actions">
          <button class="btn" onclick="editarSesion('${escapeHtml(s.idSesion)}')">Editar</button>
          <button class="btn" onclick="marcarRealizada('${escapeHtml(s.idSesion)}')">Realizada</button>
          <button class="btn" onclick="cancelarSesion('${escapeHtml(s.idSesion)}')">Cancelar</button>
        </div>
      </article>
    `).join('');
  }

  function formatFechaLarga(fechaIso) {
    const m = String(fechaIso ?? '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return String(fechaIso ?? '');
    const fecha = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    if (Number.isNaN(fecha.getTime())) return String(fechaIso ?? '');
    return fecha.toLocaleDateString('es-ES', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });
  }

  function normalizeBadgeClass(value) {
    return String(value ?? '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '');
  }

  function abrirModal(sesion) {
    document.getElementById('modalTitle').textContent = sesion ? 'Editar sesión' : 'Nueva sesión';
    document.getElementById('formSesion').reset();
    document.getElementById('idSesion').value = sesion?.idSesion || '';
    ['fecha','hora','duracionMin','tipoSesion','tema','ponente','area','estado','sustituto','enlaceMaterial','observaciones']
      .forEach((k) => document.getElementById(k).value = sesion?.[k] || '');
    document.getElementById('modalSesion').showModal();
  }

  function cerrarModal() { document.getElementById('modalSesion').close(); }

  function editarSesion(idSesion) {
    const sesion = state.sesiones.find(s => s.idSesion === idSesion);
    if (!sesion) return alert('Sesión no encontrada.');
    abrirModal(sesion);
  }

  function normalizeHoraInput(value) {
    const txt = String(value ?? '').trim();
    const m = txt.match(/^(\d{1,2})(?::(\d{1,2}))?(?::(\d{1,2}))?$/);
    if (!m) throw new Error('Hora inválida. Use HH:mm (ej: 08:15).');

    const hh = Number(m[1]);
    const mm = m[2] === undefined ? 0 : Number(m[2]);
    const ss = m[3] === undefined ? 0 : Number(m[3]);

    if (![hh, mm, ss].every(Number.isInteger) || hh < 0 || hh > 23 || mm < 0 || mm > 59 || ss < 0 || ss > 59) {
      throw new Error('Hora inválida. Use HH:mm con valores entre 00:00 y 23:59.');
    }

    return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  }

  function mostrarIncidenciasSesion() {
    if (!Array.isArray(state.incidenciasSesiones) || !state.incidenciasSesiones.length) return;
    console.warn(`Sesiones omitidas por datos inválidos:\n${state.incidenciasSesiones.join('\n')}`);
    alert('Se cargaron las sesiones válidas. Algunas filas se omitieron por datos inválidos. Revisa la consola para más detalle.');
  }

  function guardarSesion(e) {
    e.preventDefault();
    let horaNormalizada;
    try {
      horaNormalizada = normalizeHoraInput(document.getElementById('hora').value);
      document.getElementById('hora').value = horaNormalizada;
    } catch (err) {
      return mostrarError(err);
    }

    const payload = {
      idSesion: document.getElementById('idSesion').value,
      fecha: document.getElementById('fecha').value,
      hora: horaNormalizada,
      duracionMin: document.getElementById('duracionMin').value,
      tipoSesion: document.getElementById('tipoSesion').value,
      tema: document.getElementById('tema').value,
      ponente: document.getElementById('ponente').value,
      area: document.getElementById('area').value,
      estado: document.getElementById('estado').value,
      sustituto: document.getElementById('sustituto').value,
      enlaceMaterial: document.getElementById('enlaceMaterial').value,
      observaciones: document.getElementById('observaciones').value
    };

    const fn = payload.idSesion ? 'updateSesion' : 'createSesion';
    google.script.run.withSuccessHandler(() => {
      cerrarModal();
      cargarDatos();
      alert('Guardado correctamente.');
    }).withFailureHandler(mostrarError)[fn](payload);
  }

  function marcarRealizada(idSesion) {
    google.script.run.withSuccessHandler(cargarDatos).withFailureHandler(mostrarError).marcarRealizada(idSesion);
  }

  function cancelarSesion(idSesion) {
    google.script.run.withSuccessHandler(cargarDatos).withFailureHandler(mostrarError).cancelarSesion(idSesion);
  }

  function autocompletarArea() {
    const ponente = document.getElementById('ponente').value;
    const p = state.profesionales.find(x => x.nombre === ponente);
    if (p && p.area) document.getElementById('area').value = p.area;
  }

  function copiarResumenMensual() {
    const sesiones = getSesionesFiltradas();
    if (!sesiones.length) return alert('No hay sesiones para resumir.');
    const texto = sesiones.map(s => `${s.fecha} ${s.hora} | ${s.tipoSesion} | ${s.tema} | ${s.ponente} | ${s.estado}`).join('\n');
    navigator.clipboard.writeText(texto).then(() => alert('Resumen copiado al portapapeles.')).catch(() => alert('No se pudo copiar automáticamente.'));
  }

  function mostrarErrorMaestros(msg) {
    const main = document.querySelector('main.container');
    if (!main) return;
    let box = document.getElementById('errorMaestros');
    if (!box) {
      box = document.createElement('div');
      box.id = 'errorMaestros';
      box.className = 'card';
      box.style.background = '#fff4f4';
      box.style.border = '1px solid #f2b8b5';
      box.style.color = '#8a1c1a';
      box.style.marginBottom = '12px';
      main.prepend(box);
    }
    box.textContent = msg;
  }

  function ocultarErrorMaestros() {
    const box = document.getElementById('errorMaestros');
    if (box) box.remove();
  }

  function mostrarError(err) {
    const msg = err && err.message ? err.message : 'Ha ocurrido un error.';
    console.error('Error en la app:', msg, err);
    mostrarErrorMaestros("No se pudieron cargar los datos maestros. Revise que existan las pestañas 'Profesionales' y 'TiposSesion', que sus encabezados sean correctos y que haya filas activas marcadas como 'Sí'.");
    alert(msg);
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>'"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  }
</script>
